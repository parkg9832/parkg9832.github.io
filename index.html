      function localizeMapUrl(url) {
        const locale = mapLocales[language] || 'es';
        const separator = url.includes('?') ? '&' : '?';
        return `${url.replace(/([?&])hl=[^&]*/g, '')}${separator}hl=${locale}`;
      }

      function syncMapFrame() {
        const frame = document.getElementById('mapFrame');
        if (!frame) return;
        const store = selectedStoreId ? stores.find((item) => item.id === selectedStoreId) : null;
        const baseUrl = store?.mapUrl || frame.dataset.defaultMapSrc || frame.dataset.mapSrc;
        if (!baseUrl) return;
        frame.src = localizeMapUrl(baseUrl);
        frame.dataset.mapSrc = frame.src;
      }

      function getValidationMessage(input) {
        const messages = validationMessages[language] || validationMessages.ES;
        if (input.validity.valueMissing) return messages.valueMissing;
        if (input.validity.typeMismatch) return messages.typeMismatch;
        return '';
      }

      function bindLocalizedValidation() {
        ['companyInput', 'nameInput', 'emailInput', 'countrySelect', 'messageInput'].forEach((id) => {
          const input = document.getElementById(id);
          if (!input) return;
          input.addEventListener('invalid', () => {
            input.setCustomValidity('');
            input.setCustomValidity(getValidationMessage(input));
          });
          ['input', 'change'].forEach((eventName) => {
            input.addEventListener(eventName, () => input.setCustomValidity(''));
          });
        });
      }

      const revealObserver =
        'IntersectionObserver' in window
          ? new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
          )
          : null;

      function bindReveal() {
        document.querySelectorAll('[data-reveal]:not([data-reveal-bound])').forEach((element) => {
          const delay = element.getAttribute('data-reveal-delay');
          if (delay) element.style.setProperty('--reveal-delay', `${delay}ms`);
          element.setAttribute('data-reveal-bound', 'true');
          if (revealObserver) revealObserver.observe(element);
          else element.classList.add('is-visible');
        });
      }

      function setText(id, value) {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
      }

      function renderFooter(footer) {
        const element = document.getElementById('footerText');
        if (!element) return;

        element.innerHTML = `
          <div class="space-y-6">
            <div>
              <p class="text-2xl font-black tracking-tight text-white">MOKDA</p>
            </div>
            <div class="grid gap-7 text-xs leading-5 text-white/60 lg:grid-cols-[1.45fr_0.9fr]">
              <section>
                <h2 class="mb-3 text-[11px] font-bold uppercase tracking-[0.14em] text-white/70">${footer.businessTitle}</h2>
                <dl class="grid gap-x-7 gap-y-3 sm:grid-cols-2">
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.companyLabel}</dt>
                  <dd class="font-semibold text-white/75">${footer.company}</dd>
                </div>
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.ceoLabel}</dt>
                  <dd class="font-semibold text-white/75">${footer.ceo}</dd>
                </div>
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.registrationLabel}</dt>
                  <dd class="font-semibold text-white/75">${footer.registration}</dd>
                </div>
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.addressLabel}</dt>
                  <dd class="text-white/65">${footer.address}</dd>
                </div>
              </dl>
              </section>
              <section class="lg:max-w-md lg:justify-self-end">
                <h2 class="mb-3 text-[11px] font-bold uppercase tracking-[0.14em] text-white/70">${footer.ipTitle}</h2>
                <p class="text-white/55">${footer.ip}</p>
              </section>
            </div>
            <div class="text-[11px] font-semibold text-white/35">
              ${footer.copyright}
            </div>
          </div>
        `;
      }

      function setPlaceholder(id, value) {
        const node = document.getElementById(id);
        if (node) node.setAttribute('placeholder', value);
      }

      function createHeroCarousel() {
        document.getElementById('heroSlides').innerHTML = heroSlides
          .map(
            (slide, index) => `
              <div data-hero-slide="${index}" class="relative h-full min-w-full snap-center opacity-100 transition-opacity duration-[1200ms] ease-in-out md:absolute md:inset-0 md:min-w-0 md:opacity-0">
                <picture class="absolute inset-0 block h-full w-full">
                  <source media="(min-width: 768px)" srcset="${slide.desktopImage}" />
                  <img src="${slide.mobileImage}" alt="" class="h-full w-full object-cover" ${index === 0 ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"'} />
                </picture>
                <div class="absolute inset-0 z-10 bg-black/45 md:bg-black/42"></div>
                <div class="relative z-20 mx-auto flex h-full w-full max-w-6xl flex-col justify-center px-4 pt-28 pb-20 sm:px-6 lg:px-8 lg:pt-36 lg:pb-28">
                  <p data-hero-kicker class="hero-kicker-shadow mb-5 text-xs font-extrabold uppercase tracking-[0.34em] text-mokdaOrange sm:text-sm"></p>
                  <h1 data-hero-title class="hero-title-shadow max-w-5xl break-keep text-balance text-5xl font-black leading-[0.9] tracking-tight text-white [font-family:Urbanist,ui-sans-serif,system-ui] sm:text-7xl md:text-8xl lg:text-9xl animate-fade-in-up delay-200"></h1>
                  <p data-hero-subtitle class="hero-copy-shadow mt-6 max-w-2xl break-keep text-pretty text-base font-semibold leading-relaxed text-white/90 sm:text-xl animate-fade-in-up delay-500"></p>
                  <a data-hero-link href="#products" class="mt-8 inline-flex w-fit items-center rounded-full bg-mokdaOrange px-7 py-3 text-sm font-extrabold text-white transition-colors duration-300 hover:bg-orange-600 focus:outline-none focus:ring-4 focus:ring-orange-300/40 animate-fade-in-up delay-800"></a>
                </div>
              </div>
            `
          )
          .join('');

        document.getElementById('heroIndicators').innerHTML = heroSlides
          .map(
            (_, index) => `
              <button type="button" data-hero-indicator="${index}" aria-label="Go to slide ${index + 1}" onclick="setHeroSlide(${index})" class="h-2.5 w-2.5 rounded-full bg-white/55 transition-all duration-300 hover:bg-white"></button>
            `
          )
          .join('');
      }

      function bindHeroScroll() {
        const scroller = document.getElementById('heroSlides');
        scroller.addEventListener(
          'scroll',
          () => {
            if (window.matchMedia('(min-width: 768px)').matches) return;
            clearTimeout(heroScrollTimer);
            heroScrollTimer = setTimeout(() => {
              const nextSlide = Math.round(scroller.scrollLeft / scroller.clientWidth);
              if (nextSlide !== currentSlide && nextSlide >= 0 && nextSlide < heroSlides.length) {
                currentSlide = nextSlide;
                updateHeroCarousel(false);
                restartHeroCarousel();
              }
            }, 80);
          },
          { passive: true }
        );
      }

      function renderHeroText() {
        document.querySelectorAll('[data-hero-slide]').forEach((slide) => {
          const index = Number(slide.getAttribute('data-hero-slide'));
          const copy = heroSlides[index].copy[language];
          const link = slide.querySelector('[data-hero-link]');
          const title = slide.querySelector('[data-hero-title]');
          slide.querySelector('[data-hero-kicker]').textContent = copy.kicker;
          title.textContent = '';
          const titleLine1 = document.createElement('span');
          titleLine1.className = 'block';
          titleLine1.textContent = copy.title;
          title.appendChild(titleLine1);
          if (copy.titleLine2) {
            const titleLine2 = document.createElement('span');
            titleLine2.className = 'hero-title-accent mt-1 block text-[0.78em] leading-[0.9] text-mokdaOrange md:mt-2';
            titleLine2.textContent = copy.titleLine2;
            title.appendChild(titleLine2);
          }
          slide.querySelector('[data-hero-subtitle]').textContent = copy.subtitle;
          link.textContent = copy.button;
          link.setAttribute('href', heroSlides[index].href);
        });
      }

      function updateHeroCarousel(syncScroll = true) {
        document.querySelectorAll('[data-hero-slide]').forEach((slide) => {
          const isActive = Number(slide.getAttribute('data-hero-slide')) === currentSlide;
          slide.className = `relative h-full min-w-full snap-center opacity-100 transition-opacity duration-[1200ms] ease-in-out md:absolute md:inset-0 md:min-w-0 ${
            isActive ? 'md:z-10 md:opacity-100' : 'md:z-0 md:opacity-0 md:pointer-events-none'
          }`;
        });
        document.querySelectorAll('[data-hero-indicator]').forEach((indicator) => {
          const isActive = Number(indicator.getAttribute('data-hero-indicator')) === currentSlide;
          indicator.setAttribute('aria-pressed', String(isActive));
          indicator.className = `h-2.5 rounded-full transition-all duration-300 ${
            isActive ? 'w-10 bg-mokdaOrange' : 'w-2.5 bg-white/55 hover:bg-white'
          }`;
        });

        const scroller = document.getElementById('heroSlides');
        if (syncScroll && !window.matchMedia('(min-width: 768px)').matches && scroller) {
          scroller.scrollTo({ left: scroller.clientWidth * currentSlide, behavior: 'smooth' });
        }
      }

      function setHeroSlide(index) {
        currentSlide = index;
        updateHeroCarousel();
        restartHeroCarousel();
      }

      function restartHeroCarousel() {
        if (heroInterval) clearInterval(heroInterval);
        heroInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % heroSlides.length;
          updateHeroCarousel();
        }, 5000);
      }

      function renderLanguageButtons() {
        window.MOKDA_I18N.syncLanguageButtons(language);
      }

      function renderProducts(items) {
        const lang = language;
        document.getElementById('productsGrid').innerHTML = items
          .map(
            (item, index) => {
              const d = (item.desc && item.desc[lang]) ? item.desc[lang] : (item.desc ? item.desc['ES'] : { line1: '', line2: '' });
              const category = item.category ? (item.category[lang] || item.category['ES']) : item.koreanName;
              const imageClass = item.imageClass || 'hover:scale-[1.03]';
              return `
              <a href="products.html" data-reveal data-reveal-delay="${index * 120}" class="product-card flex min-w-0 flex-col items-center rounded-[1.25rem] px-3 py-7 text-center transition-all duration-300 sm:px-5 sm:py-8">
                <p class="mb-1 break-keep text-xs font-extrabold uppercase leading-tight tracking-[0.08em] text-slate-600 sm:text-sm">${category}</p>
                <h3 class="mb-4 break-keep text-2xl font-extrabold leading-tight ${item.titleClass}">${item.name}</h3>
                <div class="product-stage relative flex h-64 w-full items-center justify-center overflow-visible sm:h-72" style="--bottle-shadow:${item.shadow || 'rgba(92,45,17,0.18)'};--stage-shadow:${item.stageShadow || 'rgba(92,45,17,0.22)'};--stage-glow:${item.stageGlow || 'rgba(239,95,24,0.1)'};">
                  <img src="${item.image}" alt="${item.alt}" class="product-bottle relative z-10 h-full w-full cursor-pointer object-contain transition-transform duration-300 hover:-translate-y-1 ${imageClass}" loading="lazy" />
                </div>
                <div class="mx-auto mt-5 w-full max-w-[270px] text-center">
                  <span class="block break-keep text-sm font-medium leading-6 text-slate-700">${d.line1}</span>
                  <span class="mt-1 block break-keep text-[15px] font-extrabold leading-6 text-gray-950">${d.line2}</span>
                </div>
              </a>
            `;
            }
          )
          .join('');
      }
      function renderStores() {
        document.getElementById('storeList').innerHTML = `
          <div>
            ${stores
              .map((store) => {
                const isSelected = selectedStoreId === store.id;
                const storeName = typeof store.name === 'string' ? store.name : (store.name[language] || store.name.ES);
                const storeAddress = typeof store.address === 'string' ? store.address : (store.address[language] || store.address.ES);
                const cardClass = isSelected
                  ? 'block w-full cursor-pointer rounded-2xl bg-white p-2 text-left transition-all duration-300 md:p-4'
                  : 'block w-full cursor-pointer rounded-2xl p-2 text-left transition-all duration-300 hover:bg-white/20 md:p-4';
                const nameClass = isSelected ? 'text-neutral-950' : 'text-white';
                const addressClass = isSelected ? 'text-neutral-600' : 'text-white/75';
                const tagClass = isSelected
                  ? 'rounded-full bg-neutral-950 px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-white md:text-xs'
                  : 'rounded-full bg-neutral-950 px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-white md:text-xs';
                return `
                  <div class="border-b border-white/20 py-1.5 first:pt-0 last:border-b-0 last:pb-0 md:py-3">
                    <button type="button" onclick="selectStore('${store.id}')" aria-pressed="${isSelected}" class="${cardClass}">
                      <span class="flex flex-wrap items-center gap-2 md:gap-3">
                        <span class="break-keep text-base font-bold ${nameClass} md:text-lg">${storeName}</span>
                        <span class="${tagClass}">${store.tag}</span>
                      </span>
                      <span class="mt-1 block text-pretty text-xs font-semibold leading-4 ${addressClass} md:mt-1.5 md:text-sm md:leading-6">${storeAddress}</span>
                    </button>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      }

      function selectStore(id) {
        selectedStoreId = id;
        renderStores();
        const store = stores.find((item) => item.id === id);
        const frame = document.getElementById('mapFrame');
        if (store?.mapUrl && frame) {
          frame.src = localizeMapUrl(store.mapUrl);
          frame.dataset.mapSrc = frame.src;
          const storeName = typeof store.name === 'string' ? store.name : (store.name[language] || store.name.ES);
          frame.title = `${storeName} map`;
        }
      }

      const b2bFormMessages = {
        EN: {
          sending: 'Sending your inquiry...',
          success: 'Inquiry received. We will review it and contact you.',
          error: 'Submission failed. Please try again or contact us by email.',
          notConfigured: 'B2B automation is not connected yet.',
        },
        ES: {
          sending: 'Enviando tu consulta...',
          success: 'Consulta recibida. La revisaremos y te contactaremos.',
          error: 'No se pudo enviar. Inténtalo de nuevo o contáctanos por correo.',
          notConfigured: 'La automatización B2B aún no está conectada.',
        },
        KR: {
          sending: '문의 내용을 전송하고 있습니다...',
          success: '문의가 접수되었습니다. 확인 후 연락드리겠습니다.',
          error: '전송에 실패했습니다. 다시 시도하거나 이메일로 문의해주세요.',
          notConfigured: 'B2B 자동화가 아직 연결되지 않았습니다.',
        },
      };

      function getB2BEndpoint() {
        return String(window.MOKDA_B2B_WEB_APP_URL || '').trim();
      }

      function setFormStatus(type, message) {
        const status = document.getElementById('formStatus');
        if (!status) return;

        const colorClass = type === 'success' ? 'text-[#057a5f]' : type === 'error' ? 'text-red-600' : 'text-neutral-500';
        status.className = `mt-4 min-h-6 text-center text-sm font-bold ${colorClass}`;
        status.textContent = message || '';
      }

      function setFormSubmitting(isSubmitting) {
        const button = document.getElementById('submitButton');
        if (!button) return;

        button.disabled = isSubmitting;
        button.classList.toggle('cursor-not-allowed', isSubmitting);
        button.classList.toggle('opacity-70', isSubmitting);
      }

      async function submitB2BForm(event) {
        event.preventDefault();

        const endpoint = getB2BEndpoint();
        const messages = b2bFormMessages[language] || b2bFormMessages.ES;

        if (!endpoint) {
          setFormStatus('error', messages.notConfigured);
          return;
        }

        const form = event.currentTarget;
        const formData = new FormData(form);
        const payload = {
          language,
          company: String(formData.get('company') || '').trim(),
          name: String(formData.get('name') || '').trim(),
          email: String(formData.get('email') || '').trim(),
          country: String(formData.get('country') || '').trim(),
          purpose: String(formData.get('purpose') || '').trim(),
          message: String(formData.get('message') || '').trim(),
          website: String(formData.get('website') || '').trim(),
          pageUrl: window.location.href,
          userAgent: navigator.userAgent,
        };

        setFormSubmitting(true);
        setFormStatus('pending', messages.sending);

        try {
          await fetch(endpoint, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify(payload),
          });

          form.reset();
          renderForm((content[language] || content.ES).b2b.fields);
          setFormStatus('success', messages.success);
        } catch (error) {
          console.error(error);
          setFormStatus('error', messages.error);
        } finally {
          setFormSubmitting(false);
        }
      }

      function renderForm(fields) {
        setText('companyLabel', fields.company[0]);
        setPlaceholder('companyInput', fields.company[1]);
        setText('nameLabel', fields.name[0]);
        setPlaceholder('nameInput', fields.name[1]);
        setText('emailLabel', fields.email[0]);
        setPlaceholder('emailInput', fields.email[1]);
        setText('countryLabel', fields.country[0]);
        setText('purposeLabel', fields.purpose[0]);
        setText('messageLabel', fields.message[0]);
        setPlaceholder('messageInput', fields.message[1]);
        setText('submitButtonText', fields.submit);
        document.getElementById('countrySelect').innerHTML = `
          <option value="" selected disabled>${fields.country[1]}</option>
          ${countries.map(([value, labels]) => `<option value="${value}">${labels[language]}</option>`).join('')}
        `;
        document.getElementById('purposeSelect').innerHTML = `
          <option value="" selected disabled>${fields.purpose[1]}</option>
          ${fields.purpose[2].map((label) => `<option value="${label}">${label}</option>`).join('')}
        `;
        ['companyInput', 'nameInput', 'emailInput', 'countrySelect', 'purposeSelect', 'messageInput'].forEach((id) => {
          const field = document.getElementById(id);
          if (!field) return;
          field.setCustomValidity('');
          field.oninvalid = () => {
            if (field.validity.typeMismatch) {
              field.setCustomValidity(fields.emailError || fields.required);
              return;
            }
            field.setCustomValidity(fields.required);
          };
          field.oninput = () => field.setCustomValidity('');
          field.onchange = () => field.setCustomValidity('');
        });
      }

      function renderPage() {
        const t = content[language];
        document.documentElement.lang = window.MOKDA_I18N.getHtmlLang(language);
        renderHeroText();
        setText('storyKicker', t.story.kicker);
        document.getElementById('storyTitle').innerHTML = t.story.title;
        document.getElementById('storyBody').innerHTML = t.story.body.map((paragraph) => `<p class="break-keep leading-relaxed">${paragraph}</p>`).join('');
        setText('productsKicker', t.products.kicker);
        setText('productsTitle', t.products.title);
        setText('productsStatus', t.products.status);
        renderProducts(t.products.items);
        setText('mapKicker', t.map.kicker);
        setText('mapTitle', t.map.title);
        renderStores();
        syncMapFrame();
        setText('b2bKicker', t.b2b.kicker);
        setText('b2bTitle', t.b2b.title);
        setText('b2bDescription', t.b2b.description);
        renderForm(t.b2b.fields);
        renderFooter(t.footer);
        renderLanguageButtons();
        bindReveal();
      }

      window.MOKDA_I18N.bindLanguageButtons((nextLanguage) => {
        language = nextLanguage;
        renderPage();
      });

      document.getElementById('b2bForm').addEventListener('submit', submitB2BForm);

      window.addEventListener('pagehide', () => {
        if (heroInterval) clearInterval(heroInterval);
      });

      createHeroCarousel();
      bindHeroScroll();
      bindLocalizedValidation();
      renderPage();
      updateHeroCarousel();
      restartHeroCarousel();
    </script>
    <script src="./site-header.js"></script>
  </body>
</html>
