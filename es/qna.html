          nav: { about: 'About us', products: 'Korean Sauce', qna: 'Q&A', contact: 'Contact' },
          hero: {
            kicker: 'MOKDA Q&A',
            title: 'Questions about MOKDA',
            description: 'Find answers about Salsa Coreana, products, distribution, export, and collaboration.',
          },
          board: {
            contact: 'Send an inquiry',
          },
          social: 'SNS',
        },
        KR: {
          title: '자주 묻는 질문 | MOKDA',
          nav: { about: '브랜드 소개', products: 'Salsa Coreana', qna: 'Q&A', contact: '문의' },
          hero: {
            kicker: 'MOKDA Q&A',
            title: 'MOKDA에 대해 궁금한 점',
            description: 'Salsa Coreana, 제품, 유통, 수출, 협업과 관련된 자주 묻는 질문을 확인하세요.',
          },
          board: {
            contact: '1:1 문의하기',
          },
          social: 'SNS',
        },
      };

      function setText(id, value) {
        const element = document.getElementById(id);
        if (element) element.textContent = value;
      }

      function renderLanguageButtons() {
        window.MOKDA_I18N.syncLanguageButtons(language);
      }

      function renderQnaList() {
        const list = document.getElementById('qnaList');
        list.innerHTML = qnaItems
          .map((item, index) => {
            const localized = item[language] || item.ES;
            const itemId = `qna-${index}`;
            return `
              <article data-accordion-item class="qna-item">
                <button data-accordion-button type="button" class="qna-question-row grid w-full grid-cols-[2rem_minmax(0,1fr)_2.25rem] items-center gap-3 px-4 py-[1.125rem] text-left transition-colors duration-300 sm:grid-cols-[3rem_minmax(0,1fr)_2.5rem] sm:gap-5 sm:px-7 sm:py-6" aria-expanded="false" aria-controls="${itemId}">
                  <span class="text-xs font-black text-[#a93600]">${String(index + 1).padStart(2, '0')}</span>
                  <span class="qna-question faq-question block min-w-0 break-keep text-base leading-7 text-[#321506] transition-colors duration-300 sm:text-lg sm:leading-8">${localized.question}</span>
                  <span class="qna-icon flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#321506] text-lg leading-none text-[#f8dfc4] transition-colors"><span class="qna-glyph">+</span></span>
                </button>
                <div id="${itemId}" class="qna-answer" aria-hidden="true">
                  <div class="min-h-0 overflow-hidden">
                    <div class="qna-answer-panel"><p class="max-w-4xl px-5 py-6 text-left text-[15px] font-semibold leading-7 text-[#321506]/78 sm:px-[7.25rem] sm:py-8 sm:pr-20 sm:text-base sm:leading-8">${localized.answer}</p></div>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');

        window.MOKDA_ACCORDION.init(list);
        bindReveal();
      }

      function bindReveal() {
        const elements = document.querySelectorAll('[data-reveal]:not([data-reveal-bound])');
        if (!('IntersectionObserver' in window)) {
          elements.forEach((element) => element.classList.add('is-visible'));
          return;
        }

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
        );

        elements.forEach((element) => {
          const delay = element.getAttribute('data-reveal-delay');
          if (delay) element.style.setProperty('--reveal-delay', `${delay}ms`);
          element.setAttribute('data-reveal-bound', 'true');
          observer.observe(element);
        });
      }

      function renderPage() {
        const t = content[language] || content.ES;
        document.title = t.title;
        document.documentElement.lang = window.MOKDA_I18N.getHtmlLang(language);
        setText('nav-about', t.nav.about);
        setText('nav-products', t.nav.products);
        setText('nav-qna', t.nav.qna);
        setText('nav-contact', t.nav.contact);
        setText('pageKicker', t.hero.kicker);
        setText('pageTitle', t.hero.title);
        setText('pageDescription', t.hero.description);
        setText('boardContactLink', t.board.contact);
        setText('socialTitle', t.social);
        const pageTitle = document.getElementById('pageTitle');
        pageTitle.classList.toggle('display-latin', language !== 'KR');
        pageTitle.classList.toggle('display-korean', language === 'KR');
        renderQnaList();
        window.MOKDA_FOOTER.render(language);
        renderLanguageButtons();
        bindReveal();
      }

      window.MOKDA_I18N.bindLanguageButtons((nextLanguage) => {
        language = nextLanguage;
        renderPage();
      });

      renderPage();
    </script>
    <script src="./site-header.js?v=20260810-6"></script>
  </body>
</html>
