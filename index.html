      html {

      body {

      }

      [data-reveal] {
        opacity: 0;
        transform: translateY(2.5rem);
        transition: opacity 700ms ease-out, transform 700ms ease-out;
        transition-delay: var(--reveal-delay, 0ms);
      }

      [data-reveal].is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .no-scrollbar {
        scrollbar-width: none;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.35) rgba(255, 255, 255, 0.1);
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 3px;
      }

      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.35);
        border-radius: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        [data-reveal] {
          opacity: 1;
          transform: none;
          transition: none;
        }
      }
    </style>

            body: [

              '한국 소스 문화의 깊이를 라틴아메리카의 주방, 레스토랑, 일상 식탁에 맞춘 형태로 전합니다.',
              '한 병마다 한국의 진정성 있는 맛과 LATAM의 에너지, 따뜻함, 미식 문화를 연결합니다.',
            ],
          },
          products: {
            kicker: 'PREMIUM SAUCE LINEUP',
            title: 'MOKDA FLAVORS',
            items: localizedProducts,
          },
          map: {
            kicker: 'OFFICIAL LATAM SPOTS',
            title: 'MOKDA 공식 스팟',
          },
          b2b: {
            kicker: '도매 / B2B 문의',
            title: '비즈니스 파트너십',
            description: '리테일, 외식 메뉴, 유통 포트폴리오에 MOKDA의 진짜 한국 소스 경험을 더해보세요.',
            fields: {
              company: ['회사명', '회사명을 입력해주세요'],
              name: ['담당자명', '성함을 입력해주세요'],
              email: ['비즈니스 이메일', '이메일을 입력해주세요'],
              country: ['진출 국가', '국가를 선택해주세요'],
              message: ['문의 내용', '유통 채널, 예상 물량, 파트너십 제안을 알려주세요'],
              submit: 'B2B 문의 보내기',
            },
          },
          footer: '© 2026 MOKDA. Todos los derechos reservados.',
        },
      };

      const stores = [
        {
          id: 'mexico',
          name: 'MOKDA Seoul Market',
          address: 'Av. Insurgentes Sur 1458, CDMX',
          tag: 'Open',
          mapUrl: 'https://maps.google.com/maps?q=Av.%20Insurgentes%20Sur%201458%2C%20Mexico%20City&t=&z=4&ie=UTF8&iwloc=&output=embed',
        },
        {
          id: 'peru',
          name: 'K-Food Corner Lima',
          address: 'Av. José Larco 812, Miraflores',
          tag: 'Open',
          mapUrl: 'https://maps.google.com/maps?q=Av.%20Jose%20Larco%20812%2C%20Miraflores%2C%20Lima%2C%20Peru&t=&z=4&ie=UTF8&iwloc=&output=embed',
        },
        {
          id: 'colombia',
          name: 'Casa Corea Gourmet',
          address: 'Cra. 13 #82-19, Bogotá',
          tag: 'Soon',
          mapUrl: 'https://maps.google.com/maps?q=Cra.%2013%20%2382-19%2C%20Bogota%2C%20Colombia&t=&z=4&ie=UTF8&iwloc=&output=embed',
        },
      ];

      const reels = [
        { id: 'r1', label: 'PLAY', title: 'Salsa coreana exclusiva para LATAM', image: 'assets/reel-1.png', url: 'https://www.instagram.com/p/DXD19vTiayF/' },
        { id: 'r2', label: 'PLAY', title: '¿Quién es este chico coreano?', image: 'assets/reel-2.png', url: 'https://www.instagram.com/p/DXF9UGyktLN/?img_index=1' },
        { id: 'r3', label: 'PLAY', title: 'Diario de salsa de un chico coreano', image: 'assets/reel-3.png', url: 'https://www.instagram.com/p/DXNkM21krdC/?img_index=1' },
      ];

      const countries = [
        ['Mexico', { EN: 'Mexico', ES: 'México', KR: '멕시코' }],
        ['Peru', { EN: 'Peru', ES: 'Perú', KR: '페루' }],
        ['Colombia', { EN: 'Colombia', ES: 'Colombia', KR: '콜롬비아' }],
        ['Chile', { EN: 'Chile', ES: 'Chile', KR: '칠레' }],
        ['Argentina', { EN: 'Argentina', ES: 'Argentina', KR: '아르헨티나' }],
        ['Other', { EN: 'Other', ES: 'Otro', KR: '기타' }],
      ];

      let language = 'ES';
      let currentSlide = 0;
      let heroInterval = null;
      let heroScrollTimer = null;
      let selectedStoreId = null;
      let mapTransitionTimer = null;

      const revealObserver =
        'IntersectionObserver' in window
          ? new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
            )
          : null;

      function bindReveal() {
        document.querySelectorAll('[data-reveal]:not([data-reveal-bound])').forEach((element) => {
          const delay = element.getAttribute('data-reveal-delay');
          if (delay) element.style.setProperty('--reveal-delay', `${delay}ms`);
          element.setAttribute('data-reveal-bound', 'true');
          if (revealObserver) revealObserver.observe(element);
          else element.classList.add('is-visible');
        });
      }

      function setText(id, value) {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
      }

      function setPlaceholder(id, value) {
        const node = document.getElementById(id);
        if (node) node.setAttribute('placeholder', value);
      }

      function createHeroCarousel() {
        document.getElementById('heroSlides').innerHTML = heroSlides
          .map(
            (slide, index) => `
              <div data-hero-slide="${index}" class="relative h-full min-w-full snap-center opacity-100 transition-opacity duration-[1200ms] ease-in-out md:absolute md:inset-0 md:min-w-0 md:opacity-0">
                <img src="${slide.mobileImage}" alt="" class="absolute inset-0 block h-full w-full object-cover md:hidden" />
                <img src="${slide.desktopImage}" alt="" class="absolute inset-0 hidden h-full w-full object-cover md:block" />
                <div class="absolute inset-0 z-10 bg-black/65 md:bg-black/60"></div>
                <div class="relative z-20 mx-auto flex h-full w-full max-w-7xl flex-col justify-center px-5 py-20 sm:px-8 lg:py-28">
                  <p data-hero-kicker class="mb-5 text-xs font-black uppercase tracking-[0.34em] text-mokdaOrange [text-shadow:_0_3px_8px_rgba(0,0,0,0.9)] sm:text-sm"></p>
                  <h1 data-hero-title class="max-w-5xl break-keep text-balance text-5xl font-black leading-[0.9] tracking-tight text-white [font-family:Urbanist,ui-sans-serif,system-ui] [text-shadow:_0_6px_24px_rgba(0,0,0,0.9)] sm:text-7xl md:text-8xl lg:text-9xl"></h1>
                  <p data-hero-subtitle class="mt-6 max-w-2xl break-keep text-pretty text-base font-semibold leading-7 text-white/85 [text-shadow:_0_3px_12px_rgba(0,0,0,0.75)] sm:text-xl sm:leading-8"></p>
                  <a data-hero-link href="#products" class="mt-8 inline-flex w-fit items-center rounded-full bg-mokdaOrange px-7 py-3 text-sm font-black text-white shadow-lg shadow-black/25 transition-all duration-300 hover:-translate-y-0.5 hover:bg-orange-600 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-orange-300/40"></a>
                </div>
              </div>
            `
          )
          .join('');

        document.getElementById('heroIndicators').innerHTML = heroSlides
          .map(
            (_, index) => `
              <button type="button" data-hero-indicator="${index}" aria-label="Go to slide ${index + 1}" onclick="setHeroSlide(${index})" class="h-2.5 w-2.5 rounded-full bg-white/55 transition-all duration-300 hover:bg-white"></button>
            `
          )
          .join('');
      }

      function bindHeroScroll() {
        const scroller = document.getElementById('heroSlides');
        scroller.addEventListener(
          'scroll',
          () => {
            if (window.matchMedia('(min-width: 768px)').matches) return;
            clearTimeout(heroScrollTimer);
            heroScrollTimer = setTimeout(() => {
              const nextSlide = Math.round(scroller.scrollLeft / scroller.clientWidth);
              if (nextSlide !== currentSlide && nextSlide >= 0 && nextSlide < heroSlides.length) {
                currentSlide = nextSlide;
                updateHeroCarousel(false);
                restartHeroCarousel();
              }
            }, 80);
          },
          { passive: true }
        );
      }

      function renderHeroText() {
        document.querySelectorAll('[data-hero-slide]').forEach((slide) => {
          const index = Number(slide.getAttribute('data-hero-slide'));
          const copy = heroSlides[index].copy[language];
          const link = slide.querySelector('[data-hero-link]');
          slide.querySelector('[data-hero-kicker]').textContent = copy.kicker;
          slide.querySelector('[data-hero-title]').textContent = copy.title;
          slide.querySelector('[data-hero-subtitle]').textContent = copy.subtitle;
          link.textContent = copy.button;
          link.setAttribute('href', heroSlides[index].href);
        });
      }

      function updateHeroCarousel(syncScroll = true) {
        document.querySelectorAll('[data-hero-slide]').forEach((slide) => {
          const isActive = Number(slide.getAttribute('data-hero-slide')) === currentSlide;
          slide.className = `relative h-full min-w-full snap-center opacity-100 transition-opacity duration-[1200ms] ease-in-out md:absolute md:inset-0 md:min-w-0 ${
            isActive ? 'md:z-10 md:opacity-100' : 'md:z-0 md:opacity-0 md:pointer-events-none'
          }`;
        });
        document.querySelectorAll('[data-hero-indicator]').forEach((indicator) => {
          const isActive = Number(indicator.getAttribute('data-hero-indicator')) === currentSlide;
          indicator.setAttribute('aria-pressed', String(isActive));
          indicator.className = `h-2.5 rounded-full transition-all duration-300 ${
            isActive ? 'w-10 bg-mokdaOrange' : 'w-2.5 bg-white/55 hover:bg-white'
          }`;
        });

        const scroller = document.getElementById('heroSlides');
        if (syncScroll && !window.matchMedia('(min-width: 768px)').matches && scroller) {
          scroller.scrollTo({ left: scroller.clientWidth * currentSlide, behavior: 'smooth' });
        }
      }

      function setHeroSlide(index) {
        currentSlide = index;
        updateHeroCarousel();
        restartHeroCarousel();
      }

      function restartHeroCarousel() {
        if (heroInterval) clearInterval(heroInterval);
        heroInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % heroSlides.length;
          updateHeroCarousel();
        }, 5000);
      }

      function renderLanguageButtons() {
        ['ES', 'KR', 'EN'].forEach((lang) => {
          const button = document.getElementById(`lang${lang}`);
          button.className =
            language === lang
              ? 'h-8 rounded-full bg-mokdaOrange px-3 text-xs font-black text-white transition-colors sm:h-10 sm:px-4 sm:text-sm'
              : 'h-8 rounded-full px-3 text-xs font-black text-neutral-500 transition-colors hover:text-neutral-950 sm:h-10 sm:px-4 sm:text-sm';
          button.setAttribute('aria-pressed', String(language === lang));
        });
      }

      function renderProducts(items) {
        document.getElementById('productsGrid').innerHTML = items
          .map(
            (item, index) => `
              <article data-reveal data-reveal-delay="${index * 120}" class="flex min-w-0 flex-col items-center text-center">
                <h4 class="mb-0 break-keep text-xs font-normal leading-tight text-gray-500">${item.koreanName}</h4>
                <h3 class="mt-0 break-keep text-3xl font-black leading-tight tracking-tight ${item.titleClass}">${item.name}</h3>
                <div class="mt-1 flex h-[300px] w-full items-center justify-center md:h-[320px]">
                  <img src="${item.image}" alt="${item.alt}" class="h-full max-h-[280px] w-auto object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.06)] transition-all duration-300 ease-out hover:-translate-y-2 hover:drop-shadow-[0_15px_15px_rgba(0,0,0,0.15)] md:max-h-[300px]" loading="lazy" />
                </div>
                <div class="mx-auto mt-1 w-full max-w-[240px] overflow-visible px-0 text-center text-xs leading-5 tracking-tight text-neutral-900 sm:text-xs md:text-sm">
                  <span class="block font-medium">${item.line1}</span>
                  <span class="mt-0.5 block font-extrabold text-neutral-950">${item.line2}</span>
                </div>
              </article>
            `
          )
          .join('');
      }

      function renderStores() {
        document.getElementById('storeList').innerHTML = `
          <div>
            ${stores
              .map((store) => {
                const isSelected = selectedStoreId === store.id;
                const cardClass = isSelected
                  ? 'block w-full cursor-pointer rounded-2xl bg-white p-3 text-left shadow-md transition-all duration-300 md:p-4'
                  : 'block w-full cursor-pointer rounded-2xl p-3 text-left transition-all duration-300 hover:bg-white/20 md:p-4';
                const nameClass = isSelected ? 'text-neutral-950' : 'text-white';
                const addressClass = isSelected ? 'text-neutral-600' : 'text-white/75';
                const tagClass = isSelected
                  ? 'rounded-full bg-mokdaOrange px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-white md:text-xs'
                  : 'rounded-full bg-white/15 px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-white md:text-xs';
                return `
                  <div class="border-b border-white/20 py-3 first:pt-0 last:border-b-0 last:pb-0">
                    <button type="button" onclick="selectStore('${store.id}')" aria-pressed="${isSelected}" class="${cardClass}">
                      <span class="flex flex-wrap items-center gap-2 md:gap-3">
                        <span class="break-keep text-base font-bold ${nameClass} md:text-lg">${store.name}</span>
                        <span class="${tagClass}">${store.tag}</span>
                      </span>
                      <span class="mt-1.5 block text-pretty text-xs font-semibold leading-5 ${addressClass} md:text-sm md:leading-6">${store.address}</span>
                    </button>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      }

      function selectStore(id) {
        selectedStoreId = id;
        renderStores();
        const store = stores.find((item) => item.id === id);
        const frame = document.getElementById('mapFrame');
        const nextSrc = store?.mapUrl || 'https://maps.google.com/maps?q=Latin%20America&t=&z=4&ie=UTF8&iwloc=&output=embed';
        if (frame.dataset.mapSrc === nextSrc) return;
        clearTimeout(mapTransitionTimer);
        frame.classList.remove('opacity-100');
        frame.classList.add('opacity-0');
        mapTransitionTimer = setTimeout(() => {
          frame.src = nextSrc;
          frame.dataset.mapSrc = nextSrc;
          frame.title = store ? `${store.name} map` : 'MOKDA LATAM map';
          frame.classList.remove('opacity-0');
          frame.classList.add('opacity-100');
        }, 250);
      }

      function renderReels() {
        document.getElementById('reelsGrid').innerHTML = reels
          .map(
            (reel, index) => `
              <a
                href="${reel.url}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open ${reel.title} on Instagram"
                data-reveal
                data-reveal-delay="${index * 120}"
                class="group relative aspect-[9/16] overflow-hidden rounded-3xl bg-white shadow-sm ring-1 ring-neutral-950/5 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
              >
                <img src="${reel.image}" alt="" aria-hidden="true" class="absolute inset-0 h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy" />
                <div class="absolute inset-0 bg-gradient-to-b from-black/10 via-black/20 to-black/70"></div>
                <div class="relative z-10 flex h-full flex-col justify-between p-5">
                  <div class="grid h-11 w-11 place-items-center rounded-full bg-white text-[10px] font-black text-neutral-950 transition-transform duration-300 group-hover:scale-110">${reel.label}</div>
                  <h3 class="break-keep text-pretty text-2xl font-black leading-tight text-white sm:text-3xl">${reel.title}</h3>
                </div>
              </a>
            `
          )
          .join('');
      }

      function renderForm(fields) {
        setText('companyLabel', fields.company[0]);
        setPlaceholder('companyInput', fields.company[1]);
        setText('nameLabel', fields.name[0]);
        setPlaceholder('nameInput', fields.name[1]);
        setText('emailLabel', fields.email[0]);
        setPlaceholder('emailInput', fields.email[1]);
        setText('countryLabel', fields.country[0]);
        setText('messageLabel', fields.message[0]);
        setPlaceholder('messageInput', fields.message[1]);
        setText('submitButton', fields.submit);
        document.getElementById('countrySelect').innerHTML = `
          <option value="" selected disabled>${fields.country[1]}</option>
          ${countries.map(([value, labels]) => `<option value="${value}">${labels[language]}</option>`).join('')}
        `;
      }

      function renderPage() {
        const t = content[language];
        document.documentElement.lang = language === 'KR' ? 'ko' : language.toLowerCase();
        renderHeroText();
        setText('storyKicker', t.story.kicker);
        setText('storyTitle', t.story.title);
        document.getElementById('storyBody').innerHTML = t.story.body.map((paragraph) => `<p>${paragraph}</p>`).join('');
        setText('productsKicker', t.products.kicker);
        setText('productsTitle', t.products.title);
        renderProducts(t.products.items);
        setText('mapKicker', t.map.kicker);
        setText('mapTitle', t.map.title);
        renderStores();
        renderReels();
        setText('b2bKicker', t.b2b.kicker);
        setText('b2bTitle', t.b2b.title);
        setText('b2bDescription', t.b2b.description);
        renderForm(t.b2b.fields);
        setText('footerText', t.footer);
        renderLanguageButtons();
        bindReveal();
      }

      document.getElementById('langEN').addEventListener('click', () => {
        language = 'EN';
        renderPage();
      });

      document.getElementById('langES').addEventListener('click', () => {
        language = 'ES';
        renderPage();
      });

      document.getElementById('langKR').addEventListener('click', () => {
        language = 'KR';
        renderPage();
      });

      document.getElementById('b2bForm').addEventListener('submit', (event) => event.preventDefault());

      window.addEventListener('pagehide', () => {
        if (heroInterval) clearInterval(heroInterval);
      });

      createHeroCarousel();
      bindHeroScroll();
      renderPage();
      updateHeroCarousel();
      restartHeroCarousel();
    </script>
  </body>
</html>
