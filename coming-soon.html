    <style>

  <body class="bg-white text-neutral-950 antialiased">

            <button id="langES" type="button" class="lang-btn relative z-10 w-10 h-8 sm:w-12 sm:h-10 text-center text-xs sm:text-sm font-black transition-colors duration-300" data-index="0">ES</button>
            <button id="langKR" type="button" class="lang-btn relative z-10 w-10 h-8 sm:w-12 sm:h-10 text-center text-xs sm:text-sm font-black transition-colors duration-300" data-index="1">KR</button>
            <button id="langEN" type="button" class="lang-btn relative z-10 w-10 h-8 sm:w-12 sm:h-10 text-center text-xs sm:text-sm font-black transition-colors duration-300" data-index="2">EN</button>
          </div>
          <button id="menu-toggle" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-full p-2 text-gray-800 transition-colors duration-300 hover:bg-neutral-950/5" aria-label="Open navigation menu">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            </svg>

        </div>
      </div>
      <div id="mobile-menu" class="absolute left-0 top-16 z-50 w-full border-b border-neutral-950/5 bg-white/90 backdrop-blur-md shadow-md overflow-hidden transition-all duration-300 ease-in-out max-h-0 opacity-0 invisible">
        <div class="mx-auto flex w-full max-w-screen-2xl flex-col px-4 py-5 md:px-8">
          <a href="about.html" class="py-3 text-lg font-black tracking-tight text-neutral-950 transition hover:text-orange-600">About us</a>
          <a href="products.html" class="py-3 text-lg font-black tracking-tight text-neutral-950 transition hover:text-orange-600">Salsa Coreana</a>
          <a href="qna.html" class="py-3 text-lg font-black tracking-tight text-neutral-950 transition hover:text-orange-600">Q&A</a>
          <a href="contact.html" class="py-3 text-lg font-black tracking-tight text-neutral-950 transition hover:text-orange-600">Contact</a>
        </div>
      </div>
    </header>
    <main class="flex min-h-[75vh] items-center justify-center pt-28 pb-24 px-6 bg-[radial-gradient(rgba(229,231,235,0.45)_1px,transparent_1px)] [background-size:20px_20px]">
      <div class="text-center">
        <p class="text-sm font-black uppercase tracking-[0.35em] text-orange-600">MOKDA</p>
        <h1 id="comingSoonTitle" class="mt-5 break-keep text-3xl font-black tracking-tight sm:text-5xl">상세 페이지 준비중입니다.</h1>
        <a id="backLink" href="products.html" class="mt-8 inline-flex items-center justify-center rounded-full bg-yellow-400 px-6 py-2 font-semibold text-black transition-colors hover:bg-yellow-500">
          이전으로 돌아가기
        </a>
      </div>
    </main>

    <section id="socialBanner" class="bg-mokdaOrange py-6 text-white">
      <div class="mx-auto flex w-full max-w-6xl flex-col items-center justify-center text-center gap-6 px-4">
        <div class="flex flex-col items-center">
          <h2 class="mb-4 text-2xl font-black tracking-tight uppercase">SÍGUENOS</h2>
          <div class="flex items-center gap-6">
            <a href="https://www.instagram.com/salsa_coreana/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="text-white transition-all duration-300 ease-in-out hover:-translate-y-1 hover:opacity-75">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="h-9 w-9 fill-none stroke-current stroke-2 md:h-10 md:w-10">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1" class="fill-current stroke-none"></circle>
              </svg>
            </a>
            <a href="https://www.tiktok.com/@salsa_coreana" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="text-white transition-all duration-300 ease-in-out hover:-translate-y-1 hover:opacity-75">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="h-9 w-9 fill-current md:h-10 md:w-10">
                <path d="M16.55 3c.24 2.08 1.42 3.55 3.45 4.13v3.16a7.45 7.45 0 0 1-3.36-.86v5.91c0 3.48-2.31 5.66-5.63 5.66-3.03 0-5.01-1.88-5.01-4.72 0-3.12 2.42-4.95 5.77-4.62v3.22c-1.49-.27-2.42.29-2.42 1.31 0 .85.66 1.42 1.63 1.42 1.1 0 1.82-.69 1.82-2.17V3h3.75Z"></path>
              </svg>
            </a>
            <a href="https://www.threads.com/@salsa_coreana" target="_blank" rel="noopener noreferrer" aria-label="Threads" class="text-white transition-all duration-300 ease-in-out hover:-translate-y-1 hover:opacity-75">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="h-9 w-9 fill-none stroke-current stroke-2 md:h-10 md:w-10">
                <path d="M17.6 10.8c-.28-3.24-2.18-5.04-5.32-5.04-3.63 0-5.91 2.45-5.91 6.24 0 3.97 2.36 6.24 5.91 6.24 2.84 0 4.73-1.38 5.35-3.54.54-1.9-.64-3.34-2.86-3.51-2.17-.17-3.53.76-3.53 2.18 0 1.04.82 1.72 2.05 1.72 1.33 0 2.13-.72 2.13-1.85 0-2.28-2.21-3.69-5.13-3.24"></path>
                <path d="M19.28 8.08C18.12 4.84 15.72 3 12.2 3 7.22 3 4 6.55 4 12s3.22 9 8.2 9c3.65 0 6.24-1.93 7.3-5.14"></path>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </section>

    <footer class="bg-neutral-950 py-12 text-white">
      <div id="footerText" class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8"></div>
    </footer>

    <script src="./site-i18n.js"></script>
    <script>
      let language = window.MOKDA_I18N.getLanguage();

      const sharedFooterCopy = {
        ES: {
          businessTitle: 'Información de la empresa',
          companyLabel: 'Empresa',
          company: 'MOKDA',
          ceoLabel: 'Representante',
          ceo: 'Gyeom Park',
          registrationLabel: 'Registro comercial',
          registration: '161-07-03392',
          addressLabel: 'Dirección',
          address: '44 Nambuk 10-gil, 2F, Gimje-si, Jeonbuk State, República de Corea',
          ipTitle: 'Propiedad intelectual',
          ip: 'El nombre de marca, nombres de productos, diseños de empaque y materiales relacionados de MOKDA están en proceso de protección de marca e IP.',
          copyright: '© 2026 MOKDA. Todos los derechos reservados.',
        },
        EN: {
          businessTitle: 'Business Information',
          companyLabel: 'Company',
          company: 'MOKDA',
          ceoLabel: 'CEO',
          ceo: 'Gyeom Park',
          registrationLabel: 'Business Registration No.',
          registration: '161-07-03392',
          addressLabel: 'Address',
          address: '44 Nambuk 10-gil, 2F, Gimje-si, Jeonbuk State, Republic of Korea',
          ipTitle: 'Intellectual Property',
          ip: 'MOKDA brand name, product names, package designs, and related materials are under trademark and IP protection process.',
          copyright: '© 2026 MOKDA. All rights reserved.',
        },
        KR: {
          businessTitle: '회사 정보',
          companyLabel: '상호',
          company: 'MOKDA',
          ceoLabel: '대표',
          ceo: 'Gyeom Park',
          registrationLabel: '사업자등록번호',
          registration: '161-07-03392',
          addressLabel: '주소',
          address: '전북특별자치도 김제시 남북10길 44, 김제청년공간 E:DA(이다) 2층 입주공간(신풍동)',
          ipTitle: '지식재산권',
          ip: 'MOKDA의 브랜드명, 제품명, 패키지 디자인 및 관련 자료는 상표권 및 지식재산권 보호 절차를 진행 중입니다.',
          copyright: '© 2026 MOKDA. 모든 권리 보유.',
        },
      };

      const content = {
        ES: {
          title: "MOKDA | Próximamente",
          headline: "La página de detalles está en preparación.",
          btn: "Volver atrás",
          footer: sharedFooterCopy.ES
        },
        EN: {
          title: "MOKDA | Coming Soon",
          headline: "Detail page is under construction.",
          btn: "Go Back",
          footer: sharedFooterCopy.EN
        },
        KR: {
          title: "MOKDA | 준비중",
          headline: "상세 페이지 준비중입니다.",
          btn: "이전으로 돌아가기",
          footer: sharedFooterCopy.KR
        }
      };

      function renderLanguageButtons() {
        window.MOKDA_I18N.syncLanguageButtons(language);
      }

      function renderFooter(footer) {
        const element = document.getElementById('footerText');
        if (!element) return;

        element.innerHTML = `
          <div class="space-y-6">
            <div>
              <p class="text-2xl font-black tracking-tight text-white">MOKDA</p>
            </div>
            <div class="grid gap-7 text-xs leading-5 text-white/60 lg:grid-cols-[1.45fr_0.9fr]">
              <section>
                <h2 class="mb-3 text-[11px] font-bold uppercase tracking-[0.14em] text-white/70">${footer.businessTitle}</h2>
                <dl class="grid gap-x-7 gap-y-3 sm:grid-cols-2">
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.companyLabel}</dt>
                  <dd class="font-semibold text-white/75">${footer.company}</dd>
                </div>
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.ceoLabel}</dt>
                  <dd class="font-semibold text-white/75">${footer.ceo}</dd>
                </div>
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.registrationLabel}</dt>
                  <dd class="font-semibold text-white/75">${footer.registration}</dd>
                </div>
                <div>
                  <dt class="mb-1 font-bold text-white/40">${footer.addressLabel}</dt>
                  <dd class="text-white/65">${footer.address}</dd>
                </div>
              </dl>
              </section>
              <section class="lg:max-w-md lg:justify-self-end">
                <h2 class="mb-3 text-[11px] font-bold uppercase tracking-[0.14em] text-white/70">${footer.ipTitle}</h2>
                <p class="text-white/55">${footer.ip}</p>
              </section>
            </div>
            <div class="text-[11px] font-semibold text-white/35">
              ${footer.copyright}
            </div>
          </div>
        `;
      }

      function renderPage() {
        const t = content[language];
        document.title = t.title;
        document.documentElement.lang = window.MOKDA_I18N.getHtmlLang(language);
        
        const headline = document.getElementById('comingSoonTitle');
        if (headline) headline.textContent = t.headline;
        
        const backLink = document.getElementById('backLink');
        if (backLink) backLink.textContent = t.btn;

        renderFooter(t.footer);
        
        renderLanguageButtons();
      }

      window.MOKDA_I18N.bindLanguageButtons((nextLanguage) => {
        language = nextLanguage;
        renderPage();
      });

      renderPage();
    </script>
    <script src="./site-header.js?v=20260812-3"></script>
  </body>
</html>
