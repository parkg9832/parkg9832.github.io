          nav: { about: '브랜드 소개', products: 'Salsa Coreana', qna: 'Q&A', contact: '문의' },
          hero: {
            kicker: 'MOKDA Q&A',
            title: 'MOKDA에 대해 궁금한 점.',
            description: 'Salsa Coreana, 제품, 유통, 수출, 협업과 관련된 자주 묻는 질문을 확인하세요.',
            noteKicker: '문의 범위',
            noteText: '제품, 유통, 리테일, HORECA, 수출, 브랜드 협업 관련 문의를 확인할 수 있습니다.',
          },
          board: {
            kicker: 'FAQ / Q&A',
            title: '자주 묻는 질문',
            description: '카테고리를 선택하거나 질문을 열어 답변을 확인할 수 있습니다.',
            contact: '1:1 문의하기',
            tabs: {
              faq: '자주 묻는 질문',
              contact: '1:1 문의',
            },
          },
          categories: { ALL: 'ALL', GENERAL: 'GENERAL', PRODUCT: 'PRODUCT', B2B: 'B2B', EXPORT: 'EXPORT' },
          empty: '이 카테고리에 등록된 질문이 없습니다.',
          social: 'SÍGUENOS',
          footer: sharedFooterCopy.KR,
        },
      };

      function setText(id, value) {
        const element = document.getElementById(id);
        if (element) element.textContent = value;
      }

      function renderFooter(footer) {
        const element = document.getElementById('footerText');
        if (!element) return;

        element.innerHTML = `
          <div class="space-y-6">
            <div>
              <p class="text-2xl font-black text-white">MOKDA</p>
            </div>
            <div class="grid gap-7 text-xs leading-5 text-white/60 lg:grid-cols-[1.45fr_0.9fr]">
              <section>
                <h2 class="mb-3 text-[11px] font-bold uppercase text-white/70">${footer.businessTitle}</h2>
                <dl class="grid gap-x-7 gap-y-3 sm:grid-cols-2">
                  <div>
                    <dt class="mb-1 font-bold text-white/40">${footer.companyLabel}</dt>
                    <dd class="font-semibold text-white/75">${footer.company}</dd>
                  </div>
                  <div>
                    <dt class="mb-1 font-bold text-white/40">${footer.ceoLabel}</dt>
                    <dd class="font-semibold text-white/75">${footer.ceo}</dd>
                  </div>
                  <div>
                    <dt class="mb-1 font-bold text-white/40">${footer.registrationLabel}</dt>
                    <dd class="font-semibold text-white/75">${footer.registration}</dd>
                  </div>
                  <div>
                    <dt class="mb-1 font-bold text-white/40">${footer.addressLabel}</dt>
                    <dd class="text-white/65">${footer.address}</dd>
                  </div>
                </dl>
              </section>
              <section class="lg:max-w-md lg:justify-self-end">
                <h2 class="mb-3 text-[11px] font-bold uppercase text-white/70">${footer.ipTitle}</h2>
                <p class="text-white/55">${footer.ip}</p>
              </section>
            </div>
            <div class="text-[11px] font-semibold text-white/35">
              ${footer.copyright}
            </div>
          </div>
        `;
      }

      function renderLanguageButtons() {
        window.MOKDA_I18N.syncLanguageButtons(language);
      }

      function renderCategories(copy) {
        const categories = ['ALL', 'GENERAL', 'PRODUCT', 'B2B', 'EXPORT'];
        document.getElementById('categoryFilters').innerHTML = categories
          .map((category) => {
            const active = activeCategory === category;
            return `
              <button
                type="button"
                data-category="${category}"
                class="border-b-2 px-0 py-2 text-xs font-black transition-colors ${active ? 'border-mokdaOrange text-mokdaOrange' : 'border-transparent text-neutral-500 hover:border-neutral-300 hover:text-neutral-950'}"
              >
                ${copy.categories[category]}
              </button>
            `;
          })
          .join('');

        document.querySelectorAll('[data-category]').forEach((button) => {
          button.addEventListener('click', () => {
            activeCategory = button.dataset.category || 'ALL';
            renderCategories(copy);
            renderQnaList(copy);
          });
        });
      }

      function renderQnaList(copy) {
        const filtered = activeCategory === 'ALL' ? qnaItems : qnaItems.filter((item) => item.category === activeCategory);
        const list = document.getElementById('qnaList');

        if (!filtered.length) {
          list.innerHTML = `<p class="p-7 text-sm font-bold text-neutral-500">${copy.empty}</p>`;
          return;
        }

        list.innerHTML = filtered
          .map((item, index) => {
            const localized = item[language] || item.ES;
            const itemId = `qna-${index}`;
            return `
              <article class="qna-item border-b border-neutral-950/10 last:border-b-0">
                <button type="button" class="grid w-full grid-cols-[1fr_2rem] gap-4 px-0 py-5 text-left sm:grid-cols-[4rem_8rem_1fr_2rem] sm:items-center sm:px-2 sm:py-6" aria-expanded="false" aria-controls="${itemId}">
                  <span class="hidden text-xs font-black text-neutral-400 sm:block">${String(index + 1).padStart(2, '0')}</span>
                  <span class="hidden text-xs font-black text-mokdaOrange sm:block">${copy.categories[item.category]}</span>
                  <span class="min-w-0">
                    <span class="mb-2 flex items-center gap-3 sm:hidden">
                      <span class="text-xs font-black text-neutral-400">${String(index + 1).padStart(2, '0')}</span>
                      <span class="text-xs font-black text-mokdaOrange">${copy.categories[item.category]}</span>
                    </span>
                    <span class="block text-base font-black leading-6 text-neutral-950 sm:text-lg">${localized.question}</span>
                  </span>
                  <span class="qna-icon flex h-8 w-8 shrink-0 items-center justify-center border border-neutral-950/20 text-xl leading-none text-neutral-950">+</span>
                </button>
                <div id="${itemId}" class="qna-answer">
                  <div class="min-h-0 overflow-hidden">
                    <p class="border-t border-neutral-950/5 pb-6 pt-5 text-sm font-semibold leading-7 text-neutral-600 sm:ml-[12rem] sm:pr-16 sm:text-base">${localized.answer}</p>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');

        document.querySelectorAll('.qna-item > button').forEach((button) => {
          button.addEventListener('click', () => {
            const item = button.closest('.qna-item');
            if (!item) return;
            const isOpen = item.classList.toggle('is-open');
            button.setAttribute('aria-expanded', String(isOpen));
          });
        });
        bindReveal();
      }

      function bindReveal() {
        const elements = document.querySelectorAll('[data-reveal]:not([data-reveal-bound])');
        if (!('IntersectionObserver' in window)) {
          elements.forEach((element) => element.classList.add('is-visible'));
          return;
        }

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
        );

        elements.forEach((element) => {
          const delay = element.getAttribute('data-reveal-delay');
          if (delay) element.style.setProperty('--reveal-delay', `${delay}ms`);
          element.setAttribute('data-reveal-bound', 'true');
          observer.observe(element);
        });
      }

      function renderPage() {
        const t = content[language] || content.ES;
        document.title = t.title;
        document.documentElement.lang = window.MOKDA_I18N.getHtmlLang(language);
        setText('nav-about', t.nav.about);
        setText('nav-products', t.nav.products);
        setText('nav-qna', t.nav.qna);
        setText('nav-contact', t.nav.contact);
        setText('pageKicker', t.hero.kicker);
        setText('pageTitle', t.hero.title);
        setText('pageDescription', t.hero.description);
        setText('heroNoteKicker', t.hero.noteKicker);
        setText('heroNoteText', t.hero.noteText);
        setText('boardKicker', t.board.kicker);
        setText('boardTitle', t.board.title);
        setText('boardDescription', t.board.description);
        setText('boardContactLink', t.board.contact);
        setText('faqTab', t.board.tabs.faq);
        setText('contactTab', t.board.tabs.contact);
        setText('socialTitle', t.social);
        renderCategories(t);
        renderQnaList(t);
        renderFooter(t.footer);
        renderLanguageButtons();
        bindReveal();
      }

      window.MOKDA_I18N.bindLanguageButtons((nextLanguage) => {
        language = nextLanguage;
        renderPage();
      });

      renderPage();
    </script>
    <script src="./site-header.js"></script>
  </body>
</html>
