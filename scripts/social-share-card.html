<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>MOKDA social share card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #f8dfc4;
      }

      body {
        color: #321506;
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          linear-gradient(rgba(50, 21, 6, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(50, 21, 6, 0.045) 1px, transparent 1px),
          #f8dfc4;
        background-size: 60px 60px;
      }

      .food {
        position: absolute;
        inset: 0 0 0 430px;
        overflow: hidden;
        clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
      }

      .food img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 67% 52%;
        transform: scale(1.02);
      }

      .food::after {
        position: absolute;
        inset: 0;
        content: "";
        background:
          linear-gradient(90deg, rgba(248, 223, 196, 0.42), transparent 25%),
          linear-gradient(0deg, rgba(50, 21, 6, 0.1), transparent 22%);
      }

      .copy {
        position: absolute;
        z-index: 2;
        top: 96px;
        left: 48px;
        display: flex;
        width: 430px;
        height: 430px;
        align-items: center;
        justify-content: center;
      }

      .logo {
        width: 360px;
        height: 360px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="MOKDA Salsa Coreana social sharing image">
      <div class="food">
        <img src="../assets/images/hero-mokda-sauce-pour-v2.png" alt="" />
      </div>
      <div class="copy">
        <img class="logo" src="../assets/images/mokda-logo-main.webp" alt="MOKDA" />
      </div>
    </main>
  </body>
</html>
