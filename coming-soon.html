<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOKDA | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
    </style>
    <link rel="icon" type="image/png" href="./assets/Favicon.png" />
  </head>
  <body class="bg-white text-neutral-950 antialiased">
    <header class="fixed top-0 left-0 w-full z-50 bg-white shadow-sm h-16">
      <div class="flex items-center justify-between w-full h-full max-w-screen-2xl mx-auto px-4 md:px-8 py-3">
        <div class="flex items-center gap-4">
          <button id="menu-toggle" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-full p-2 text-neutral-950 transition hover:bg-stone-100" aria-label="Open navigation menu">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </button>
          <a href="index.html" class="inline-flex flex-shrink-0 items-center" aria-label="MOKDA home">
            <img src="assets/assetlogo-1-.png" alt="MOKDA" class="h-6 w-auto sm:h-9" />
          </a>
        </div>
        <div class="flex items-center gap-2 rounded-full bg-stone-100 p-0.5 shadow-sm sm:p-1" aria-label="Language switcher">
          <button id="langES" type="button" class="h-8 rounded-full px-3 text-xs font-black transition-colors sm:h-10 sm:px-4 sm:text-sm">ES</button>
          <button id="langKR" type="button" class="h-8 rounded-full px-3 text-xs font-black transition-colors sm:h-10 sm:px-4 sm:text-sm">KR</button>
          <button id="langEN" type="button" class="h-8 rounded-full px-3 text-xs font-black transition-colors sm:h-10 sm:px-4 sm:text-sm">EN</button>
        </div>
      </div>
      <div id="mobile-menu" class="absolute left-0 top-16 z-50 hidden w-full border-b border-neutral-950/5 bg-white shadow-md">
        <div class="mx-auto flex w-full max-w-screen-2xl flex-col px-4 py-5 md:px-8">
          <a href="about.html" class="py-3 text-lg font-black tracking-tight text-neutral-950 transition hover:text-orange-600">About us</a>
          <a href="products.html" class="py-3 text-lg font-black tracking-tight text-neutral-950 transition hover:text-orange-600">Salsa Coreana</a>
        </div>
      </div>
    </header>
    <main class="flex h-screen items-center justify-center px-6 bg-[radial-gradient(rgba(229,231,235,0.45)_1px,transparent_1px)] [background-size:20px_20px]">
      <div class="text-center">
        <p class="text-sm font-black uppercase tracking-[0.35em] text-orange-600">MOKDA</p>
        <h1 id="comingSoonTitle" class="mt-5 break-keep text-3xl font-black tracking-tight sm:text-5xl">상세 페이지 준비중입니다.</h1>
        <a id="backLink" href="products.html" class="mt-8 inline-flex items-center justify-center rounded-full bg-yellow-400 px-6 py-2 font-semibold text-black transition-colors hover:bg-yellow-500">
          이전으로 돌아가기
        </a>
      </div>
    </main>
    <script>
      let language = localStorage.getItem('mokdaLanguage') || 'ES';

      const content = {
        ES: {
          title: "MOKDA | Próximamente",
          headline: "La página de detalles está en preparación.",
          btn: "Volver atrás"
        },
        EN: {
          title: "MOKDA | Coming Soon",
          headline: "Detail page is under construction.",
          btn: "Go Back"
        },
        KR: {
          title: "MOKDA | 준비중",
          headline: "상세 페이지 준비중입니다.",
          btn: "이전으로 돌아가기"
        }
      };

      function renderLanguageButtons() {
        ['ES', 'KR', 'EN'].forEach((lang) => {
          const button = document.getElementById(`lang${lang}`);
          if (button) {
            button.className =
              language === lang
                ? 'h-8 rounded-full bg-orange-600 px-3 text-xs font-black text-white transition-colors sm:h-10 sm:px-4 sm:text-sm'
                : 'h-8 rounded-full px-3 text-xs font-black text-neutral-500 transition-colors hover:text-neutral-950 sm:h-10 sm:px-4 sm:text-sm';
            button.setAttribute('aria-pressed', String(language === lang));
          }
        });
      }

      function renderPage() {
        const t = content[language];
        document.title = t.title;
        document.documentElement.lang = language === 'KR' ? 'ko' : language.toLowerCase();
        
        const headline = document.getElementById('comingSoonTitle');
        if (headline) headline.textContent = t.headline;
        
        const backLink = document.getElementById('backLink');
        if (backLink) backLink.textContent = t.btn;
        
        renderLanguageButtons();
      }

      document.getElementById('langEN').addEventListener('click', () => {
        language = 'EN';
        localStorage.setItem('mokdaLanguage', 'EN');
        renderPage();
      });

      document.getElementById('langES').addEventListener('click', () => {
        language = 'ES';
        localStorage.setItem('mokdaLanguage', 'ES');
        renderPage();
      });

      document.getElementById('langKR').addEventListener('click', () => {
        language = 'KR';
        localStorage.setItem('mokdaLanguage', 'KR');
        renderPage();
      });

      const menuToggle = document.getElementById('menu-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      if (menuToggle && mobileMenu) {
        menuToggle.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
        });
      }

      renderPage();
    </script>
  </body>
</html>
