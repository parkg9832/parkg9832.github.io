      function localizeMapUrl(url) {
        const locale = mapLocales[language] || 'es';

        return `${url.replace(/([?&])hl=[^&]*/g, '')}${separator}hl=${locale}`;

      function syncMapFrame() {

        const baseUrl = store?.mapUrl || frame.dataset.defaultMapSrc || frame.dataset.mapSrc;
        if (!baseUrl) return;
        frame.src = localizeMapUrl(baseUrl);
        frame.dataset.mapSrc = frame.src;

      function getValidationMessage(input) {
        const messages = validationMessages[language] || validationMessages.ES;
        if (input.validity.valueMissing) return messages.valueMissing;
        if (input.validity.typeMismatch) return messages.typeMismatch;
        return '';

      function bindLocalizedValidation() {
        ['companyInput', 'nameInput', 'emailInput', 'countrySelect', 'messageInput'].forEach((id) => {
          const input = document.getElementById(id);
          if (!input) return;
          input.addEventListener('invalid', () => {
            input.setCustomValidity('');
            input.setCustomValidity(getValidationMessage(input));
          });
          ['input', 'change'].forEach((eventName) => {
            input.addEventListener(eventName, () => input.setCustomValidity(''));
          });
        });

          ? new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
          )
          : null;

      function bindReveal() {
        document.querySelectorAll('[data-reveal]:not([data-reveal-bound])').forEach((element) => {

          if (delay) element.style.setProperty('--reveal-delay', `${delay}ms`);
          element.setAttribute('data-reveal-bound', 'true');
          if (revealObserver) revealObserver.observe(element);
          else element.classList.add('is-visible');

              const nextSlide = Math.round(scroller.scrollLeft / scroller.clientWidth);
              if (nextSlide !== currentSlide && nextSlide >= 0 && nextSlide < heroSlides.length) {
                currentSlide = nextSlide;

        document.querySelectorAll('[data-hero-indicator]').forEach((indicator) => {

        const scroller = document.getElementById('heroSlides');
        if (syncScroll && !window.matchMedia('(min-width: 768px)').matches && scroller) {
          scroller.scrollTo({ left: scroller.clientWidth * currentSlide, behavior: 'smooth' });

      function setFormStatus(type, message) {
        const status = document.getElementById('formStatus');
        if (!status) return;

        const colorClass = type === 'success' ? 'text-[#057a5f]' : type === 'error' ? 'text-red-600' : 'text-neutral-500';
        status.className = `mt-4 min-h-6 text-center text-sm font-bold ${colorClass}`;
        status.textContent = message || '';

      function setFormSubmitting(isSubmitting) {
        const button = document.getElementById('submitButton');
        if (!button) return;

        button.disabled = isSubmitting;
        button.classList.toggle('cursor-not-allowed', isSubmitting);
        button.classList.toggle('opacity-70', isSubmitting);
      }

      async function submitB2BForm(event) {
        event.preventDefault();

        const endpoint = getB2BEndpoint();
        const messages = b2bFormMessages[language] || b2bFormMessages.ES;

        if (!endpoint) {
          setFormStatus('error', messages.notConfigured);
          return;
        }

        const form = event.currentTarget;
        const formData = new FormData(form);
        const payload = {
          language,
          company: String(formData.get('company') || '').trim(),
          name: String(formData.get('name') || '').trim(),
          email: String(formData.get('email') || '').trim(),
          country: String(formData.get('country') || '').trim(),
          purpose: String(formData.get('purpose') || '').trim(),
          message: String(formData.get('message') || '').trim(),
          website: String(formData.get('website') || '').trim(),
          pageUrl: window.location.href,
          userAgent: navigator.userAgent,
        };

        setFormSubmitting(true);
        setFormStatus('pending', messages.sending);

        try {
          await fetch(endpoint, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify(payload),
          });

          form.reset();
          renderForm((content[language] || content.ES).b2b.fields);
          setFormStatus('success', messages.success);
        } catch (error) {
          console.error(error);
          setFormStatus('error', messages.error);
        } finally {
          setFormSubmitting(false);
        }
      }

          ${fields.purpose[2].map((label) => `<option value="${label}">${label}</option>`).join('')}
        `;
        ['companyInput', 'nameInput', 'emailInput', 'countrySelect', 'purposeSelect', 'messageInput'].forEach((id) => {
          const field = document.getElementById(id);
          if (!field) return;
          field.setCustomValidity('');
          field.oninvalid = () => {
            if (field.validity.typeMismatch) {
              field.setCustomValidity(fields.emailError || fields.required);
              return;
            }
            field.setCustomValidity(fields.required);
          };
          field.oninput = () => field.setCustomValidity('');
          field.onchange = () => field.setCustomValidity('');
        });
      }

        renderSample(t.sample);
        setText('b2bKicker', t.b2b.kicker);
        setText('b2bTitle', t.b2b.title);
        setText('b2bDescription', t.b2b.description);
        renderForm(t.b2b.fields);
        setText('footerText', t.footer);
        renderLanguageButtons();
        bindReveal();
      }

      window.MOKDA_I18N.bindLanguageButtons((nextLanguage) => {
        language = nextLanguage;
        renderPage();
      });

      document.getElementById('b2bForm').addEventListener('submit', submitB2BForm);

      window.addEventListener('pagehide', () => {
        if (heroInterval) clearInterval(heroInterval);
      });

      createHeroCarousel();
      bindHeroScroll();
      bindLocalizedValidation();
      renderPage();
      updateHeroCarousel();
      restartHeroCarousel();
    </script>
    <script src="./site-header.js"></script>
  </body>
</html>
